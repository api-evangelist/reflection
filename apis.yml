description: >-
  Reflection AI is an artificial intelligence research lab building frontier open
  intelligence — open models that let anyone control their own intelligence and help
  shape the future of AI. Founded by former Google DeepMind researchers and backed by
  Lightspeed Venture Partners, the company frames its work as a path to superintelligence,
  sharing research and perspectives through its blog rather than a public developer product.
  As of this profile Reflection AI publishes no public API, SDK, developer portal, or MCP
  server; this entry captures the company's verified identity and public web properties for
  the API Evangelist network and will be re-enriched if a developer surface appears.
